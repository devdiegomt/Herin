<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Precarga de las fuentes: evita el salto de tipografía al cargar -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- El catálogo vive en Supabase: abrir la conexión antes ahorra ~100ms -->
    <link rel="preconnect" href="https://hsyyuezzogbviymknzbg.supabase.co" crossorigin />

    <!-- SEO -->
    <title data-static-seo>Herin — Materas y Velas Artesanales | Zipaquirá, Colombia</title>
    <meta data-static-seo
      name="description"
      content="Materas de cemento y marmolina, velas de cera de soja pintadas a mano. Piezas únicas hechas a mano en Zipaquirá. Punto físico y pedidos por WhatsApp."
    />
    <link data-static-seo rel="canonical" href="https://herin.vercel.app/" />

    <!--
      Open Graph. Estas etiquetas son las que leen WhatsApp e Instagram al
      compartir un link: como el sitio se renderiza en el cliente, los
      previsualizadores solo ven ESTE HTML, no el de cada producto.
    -->
    <meta data-static-seo property="og:site_name" content="Herin" />
    <meta data-static-seo property="og:title" content="Herin — Materas y velas artesanales" />
    <meta data-static-seo
      property="og:description"
      content="Piezas únicas hechas a mano en Zipaquirá. Mira el catálogo y escríbenos por WhatsApp."
    />
    <meta data-static-seo property="og:type" content="website" />
    <meta data-static-seo property="og:locale" content="es_CO" />
    <meta data-static-seo property="og:url" content="https://herin.vercel.app/" />
    <meta data-static-seo property="og:image" content="https://herin.vercel.app/images/og-herin.jpg" />
    <meta data-static-seo property="og:image:width" content="1200" />
    <meta data-static-seo property="og:image:height" content="630" />
    <meta data-static-seo property="og:image:alt" content="Materas y velas artesanales Herin" />

    <meta data-static-seo name="twitter:card" content="summary_large_image" />
    <meta data-static-seo name="twitter:title" content="Herin — Materas y velas artesanales" />
    <meta data-static-seo
      name="twitter:description"
      content="Piezas únicas hechas a mano en Zipaquirá. Mira el catálogo y escríbenos por WhatsApp."
    />
    <meta data-static-seo name="twitter:image" content="https://herin.vercel.app/images/og-herin.jpg" />

    <!-- Theme -->
    <meta name="theme-color" content="#FCFBF9" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
